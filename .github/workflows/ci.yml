# Run the tests on Linux and Windows for the oldest and newest supported
# Python version, build the docs and the Docker image. For release tags (v*)
# of the TUW-GEO repository, publish the package to PyPI and the Docker image
# to the GitHub container registry.

name: CI/CD

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *' # daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # cancel running jobs of the same branch / PR, except for tags
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:  # Required to upload docker image
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LATEST_PYTHON: '3.14'  # newest supported version, used for docs and dist

jobs:
  build:
    name: py${{ matrix.python-version }}@${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # new Python versions are tested before all dependencies provide wheels
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ['3.11', '3.14']  # oldest and newest supported
        experimental: [false]
        include:
          # newest Python release, not all dependencies have wheels yet
          - os: "ubuntu-latest"
            python-version: '3.15'
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          lfs: true
      - name: Checkout LFS objects
        run: git lfs checkout
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testing]"
      - name: Print Infos
        shell: bash
        run: |
          ls -R tests/smos-test-data
          which pip
          which python
          pip list
      - name: Export Environment
        shell: bash
        run: |
          mkdir -p artifacts
          filename=env_py${{ matrix.python-version }}_${{ matrix.os }}.txt
          pip freeze --exclude-editable > artifacts/$filename
      - name: Run tests
        shell: bash
        run: |
          pytest
      - name: Upload Coverage
        shell: bash
        run: |
          pip install coveralls && coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: py${{ matrix.python-version }}-${{ matrix.os }}
          COVERALLS_PARALLEL: true
      - name: Create wheel and dist package
        # pure python package: build sdist and wheel only once
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.LATEST_PYTHON
        shell: bash
        run: |
          pip install build twine
          python -m build --outdir artifacts/dist
          twine check artifacts/dist/*
          ls artifacts/dist
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-py${{ matrix.python-version }}-${{ matrix.os }}
          path: artifacts/*

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.LATEST_PYTHON }}
      - name: Install package with docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"
      - name: Build docs (warnings are errors)
        run: |
          python -m sphinx -W --keep-going -b html docs docs/_build/html

  publish-coverage:
    name: Publish Coverage 👚
    needs: build
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
      - name: Finished
        run: |
          pip3 install --upgrade coveralls && coveralls --service=github --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi-package:
    name: Publish PyPI 🚀
    # Will only trigger when the Tests have passed, and this is a release / tag branch from the TUW-GEO repository
    if: startsWith(github.ref, 'refs/tags/v') && startsWith(github.repository, 'TUW-GEO')
    needs: [build, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Print environment variables
        run: |
          echo "GITHUB_REF = $GITHUB_REF"
          echo "GITHUB_REPOSITORY = $GITHUB_REPOSITORY"
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: Artifacts
          pattern: Artifacts-*
          merge-multiple: true
      - name: Display downloaded files
        run: ls -aR
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true
          verbose: true
          verify-metadata: true
          packages-dir: Artifacts/dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }} # this needs to be uploaded to github actions secrets

  docker-image:
    name: Docker 📦
    # The image is built for every run (to test the Dockerfile), but only
    # published for release tags of the TUW-GEO repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && startsWith(github.repository, 'TUW-GEO') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # for the package version (setuptools_scm)
      - name: Log in to the Container registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: PYTHON_VERSION=${{ env.LATEST_PYTHON }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate artifact attestation
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
